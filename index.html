  <!-- Tailwind CSS CDN -->

</head>
<body class="selection:bg-emerald-200">
  <div id="root"></div>

  <!-- APPLICATION CODE -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- TRANSLATIONS DICTIONARY ---
    const translations = {
      en: {
        appTitle: "Poshan Setu",
        tagline: "Healthy Children, Empowered India",

        offline: "ઓફલાઇન",

        welcomeSubtitle: "આંગણવાડી કાર્યકરો માટેની એપ્લિકેશન",
        loginPrompt: "દૈનિક રજિસ્ટર અને સ્ટોક વ્યવસ્થાપન માટે કૃપા કરીને લોગિન કરો",

        passwordLabel: "પાસવર્ડ (Password)",
        loginButton: "પોષણસેતુમાં લોગિન કરો",
        stockReceived: "સ્ટોક આવક",
        stockUsage: "સ્ટોક વપરાશ",
        balanceRemaining: "બાકી જથ્થો\n(વસ્તુ મુજબ)",
        setuShareExchange: "સેતુ શેર\nવિનિમય",
        dailyFoodMenu: "દૈનિક\nભોજન મેનૂ",
        studentAttendance: "બાળકોની\nહાજરી",
        mealPhotoUpload: "ભોજન ફોટો\nઅપલોડ",
        smartRation: "સ્માર્ટ\nરેશન",
        downloadReport: "રિપોર્ટ\nડાઉનલોડ",
        home: "મુખ્ય પેજ",
        help: "સહાય",
        centreDetails: "કેન્દ્ર વિગત",
        profile: "પ્રોફાઇલ",
        back: "પાછા જાઓ",
        present: "હાજર",
        absent: "ગેરહાજર"
      }
    };

    // --- DATA STORE INITIALS ---
    const INITIAL_STUDENTS = [
      { id: 1, rollNo: '01', name: 'Aarav Patel', nameGu: 'આરવ પટેલ', age: '4y', present: true },
      { id: 2, rollNo: '02', name: 'Diya Shah', nameGu: 'દીયા શાહ', age: '5y', present: true },
      { id: 3, rollNo: '03', name: 'Vihaan Mehta', nameGu: 'વિહાન મહેતા', age: '4y', present: true },
      { id: 4, rollNo: '04', name: 'Ananya Joshi', nameGu: 'અનન્યા જોશી', age: '3y', present: true },
      { id: 5, rollNo: '05', name: 'Kabir Parmar', nameGu: 'કબીર પરમાર', age: '5y', present: true },
      { id: 6, rollNo: '06', name: 'Riya Desai', nameGu: 'રીયા દેસાઈ', age: '4y', present: true },
      { id: 7, rollNo: '07', name: 'Dev Solanki', nameGu: 'દેવ સોલંકી', age: '5y', present: true },
      { id: 8, rollNo: '08', name: 'Ishita Vaghela', nameGu: 'ઈશિતા વાઘેલા', age: '3y', present: true },
      { id: 9, rollNo: '09', name: 'Rudra Makwana', nameGu: 'રુદ્ર મકવાણા', age: '4y', present: true },
      { id: 10, rollNo: '10', name: 'Priya Chavda', nameGu: 'પ્રિયા ચાવડા', age: '5y', present: true }
    ];

    const INITIAL_INVENTORY = [
      { id: 'rice', nameEn: 'Fortified Rice', nameGu: 'ચોખા', unit: 'kg', currentStock: 48, initialStock: 60, minThreshold: 15, batchNo: 'RIC-26-04', expiryDate: '12-2027' },
      { id: 'oil', nameEn: 'Fortified Edible Oil', nameGu: 'તેલ', unit: 'litre', currentStock: 22, initialStock: 30, minThreshold: 8, batchNo: 'OIL-26-09', expiryDate: '08-2027' },
      { id: 'bal_shakti', nameEn: 'Bal Shakti Premix', nameGu: 'બાલ શક્તિ', unit: 'Pack', currentStock: 35, initialStock: 50, minThreshold: 12, batchNo: 'BAL-26-22', expiryDate: '06-2027' },
      { id: 'matru_shakti', nameEn: 'Matru Shakti Premix', nameGu: 'માતૃ શક્તિ', unit: 'Pack', currentStock: 24, initialStock: 35, minThreshold: 10, batchNo: 'MAT-26-18', expiryDate: '07-2027' },
      { id: 'purna_shakti', nameEn: 'Purna Shakti Premix', nameGu: 'પૂર્ણા શક્તિ', unit: 'Pack', currentStock: 20, initialStock: 30, minThreshold: 8, batchNo: 'PUR-26-05', expiryDate: '07-2027' },
      { id: 'atta', nameEn: 'Whole Wheat Atta', nameGu: 'ઘઉંનો લોટ', unit: 'kg', currentStock: 50, initialStock: 70, minThreshold: 15, batchNo: 'ATT-26-11', expiryDate: '04-2027' },
      { id: 'dal', nameEn: 'Tuver Dal', nameGu: 'તુવેર દાળ', unit: 'kg', currentStock: 25, initialStock: 35, minThreshold: 10, batchNo: 'DAL-26-33', expiryDate: '10-2027' }
    ];

    // --- FIREBASE SYNCHRONIZER ---
    const AWC_PATH = "awc_awvad04";
    let dbInstance = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp({ databaseURL: "https://poshan-setu-default-rtdb.firebaseio.com/" });
      }
      dbInstance = firebase.database();
    } catch(e) { console.warn("Firebase Init note", e); }

    function pushRTDB(path, payload, isOnline) {
      if (!isOnline || !dbInstance) {
        const queue = JSON.parse(localStorage.getItem('poshansetu_offline_queue') || '[]');
        queue.push({ path: `${AWC_PATH}/${path}`, payload, timestamp: Date.now() });
        localStorage.setItem('poshansetu_offline_queue', JSON.stringify(queue));
        return;
      }
      try {
        dbInstance.ref(`${AWC_PATH}/${path}`).push({ ...payload, syncedAt: new Date().toISOString() });
      } catch(e) { console.warn("Push error", e); }
    }

    function updateRTDBInventory(invMap, isOnline) {
      if (!isOnline || !dbInstance) return;
      try {
        dbInstance.ref(`${AWC_PATH}/inventory`).set({ ...invMap, lastUpdated: new Date().toISOString() });
      } catch(e) {}
    }

    // --- COMPONENTS ---
    const Logo = ({ size = 'sm' }) => (
      <div className="flex items-center gap-2">
        <div className={size === 'lg' ? 'w-16 h-16' : 'w-9 h-9'}>
          <svg viewBox="0 0 100 100" fill="none" className="w-full h-full">
            <path d="M32 20C26 22 20 30 22 38C30 38 38 30 38 22C38 20 35 19 32 20Z" fill="#529E2F"/>
            <path d="M68 18C74 20 80 28 78 36C70 36 62 28 62 20C62 18 65 17 68 18Z" fill="#529E2F"/>
            <circle cx="52" cy="19" r="6.5" fill="#E85D04"/>
            <path d="M40 9C38 15 44 26 50 33C56 40 59 48 53 58C50 63 47 62 47 62C52 56 57 46 51 38C45 30 36 21 38 11C38.5 9 39.5 9 40 9Z" fill="#E85D04"/>
            <circle cx="36" cy="42" r="5" fill="#15803D"/>
            <circle cx="68" cy="45" r="4.8" fill="#65A30D"/>
            <path d="M26 77C33 68 67 68 74 77V80C68 78 32 78 26 80V77Z" fill="#15803D"/>
          </svg>
        </div>
        <div className="font-extrabold tracking-tight leading-none">
          <span className={`${size === 'lg' ? 'text-3xl' : 'text-xl'} text-[#EA580C]`}>Poshan</span>
          <span className={`${size === 'lg' ? 'text-3xl' : 'text-xl'} text-[#166534] ml-1`}>Setu</span>
        </div>
      </div>
    );

    // --- MAIN APP ---
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [lang, setLang] = useState('en');
      const [isOnline, setIsOnline] = useState(true);
      const [currentScreen, setCurrentScreen] = useState('home');
      const [dockTab, setDockTab] = useState('home');
      
      const [students, setStudents] = useState(() => {
        const local = localStorage.getItem('poshansetu_students');
        return local ? JSON.parse(local) : INITIAL_STUDENTS;
      });

      const [inventory, setInventory] = useState(() => {
        const local = localStorage.getItem('poshansetu_inventory');
        return local ? JSON.parse(local) : INITIAL_INVENTORY;
      });

      // Modals
      const [isNotifOpen, setIsNotifOpen] = useState(false);
      const [isHelpOpen, setIsHelpOpen] = useState(false);
      const [isCentreOpen, setIsCentreOpen] = useState(false);
      const [isProfileOpen, setIsProfileOpen] = useState(false);

      const t = translations[lang];

      useEffect(() => {
        localStorage.setItem('poshansetu_students', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('poshansetu_inventory', JSON.stringify(inventory));
      }, [inventory]);

      // Sync student presence changes to Firebase RTDB
      const handleToggleStudent = (id) => {
        const updated = students.map(s => s.id === id ? { ...s, present: !s.present } : s);
        setStudents(updated);
        pushRTDB('students', updated, isOnline);
      };

      const handleSetAllStudents = (present) => {
        const updated = students.map(s => ({ ...s, present }));
        setStudents(updated);
        pushRTDB('students', updated, isOnline);
      };

      const handleMealConfirm = (data) => {
        const deductionKg = Number((data.totalGm / 1000).toFixed(2));
        setInventory(prev => prev.map(item => {
          if (data.menuName.includes('Atta') && item.id === 'atta') {
            return { ...item, currentStock: Math.max(0, item.currentStock - deductionKg) };
          }
          if (data.menuName.includes('Khichdi') && (item.id === 'rice' || item.id === 'dal')) {
            return { ...item, currentStock: Math.max(0, item.currentStock - (deductionKg / 2)) };
          }
          return item;
        }));

        pushRTDB('meal_entries', {
          mealType: data.mealType,
          menuName: data.menuName,
          studentsPresent: data.studentsCount,
          totalGrams: data.totalGm,
          timestamp: new Date().toISOString()
        }, isOnline);

        const invMap = {};
        inventory.forEach(i => invMap[i.id] = i.currentStock);
        updateRTDBInventory(invMap, isOnline);
      };

      const handleDistributionConfirm = (record) => {
        setInventory(prev => prev.map(item => {
          const mapKey = { rice: 'Rice', oil: 'Oil', bal_shakti: 'Bal Shakti', matru_shakti: 'Matru Shakti', purna_shakti: 'Purna Shakti', atta: 'Atta' };
          const key = mapKey[item.id];
          if (key && record.distributedItems[key]) {
            return { ...item, currentStock: Math.max(0, item.currentStock - record.distributedItems[key]) };
          }
          return item;
        }));

        pushRTDB('distributions', {
          beneficiary: record.beneficiaryName,
          items: record.distributedItems,
          timestamp: new Date().toISOString()
        }, isOnline);

        const invMap = {};
        inventory.forEach(i => invMap[i.id] = i.currentStock);
        updateRTDBInventory(invMap, isOnline);
      };

      return (
        <div className="min-h-screen bg-slate-200/80 flex justify-center py-0 sm:py-6 selection:bg-emerald-200">
          <main className="w-full max-w-[420px] bg-[#F4FAF4] min-h-screen relative pb-20 shadow-2xl flex flex-col border-x border-slate-300">
            
            <!-- TOP PHONE STATUS BAR -->
            <div className="px-5 pt-2 pb-1 flex items-center justify-between text-slate-800 text-[12px] font-bold select-none z-50">
              <span>10:38</span>
              <div className="flex items-center gap-1.5">
                <span className="text-[10px] bg-slate-200 px-1 rounded">VoLTE</span>
                <span>4G</span>
                <span>58%</span>
                <div className="w-5 h-2.5 border border-slate-700 rounded-xs p-0.5 flex items-center">
                  <div className="h-full bg-slate-800 w-[58%]"></div>
                </div>
              </div>
            </div>

            <!-- VIEW ROUTING -->
            <div className="flex-1">
              {!isAuthenticated ? (
                <!-- LOGIN SCREEN -->
                <div className="px-5 pt-4 pb-8 space-y-4">
                  <div className="flex justify-between items-center">
                    <span className="text-[11px] font-semibold text-emerald-800 bg-[#EAF7EE] px-2.5 py-1 rounded-full border border-emerald-200">
                      Govt. of Gujarat • WCD
                    </span>
                    <button 
                      onClick={() => setLang(l => l === 'en' ? 'gu' : 'en')}
                      className="px-2.5 py-1 bg-white border border-slate-300 rounded-full text-xs font-bold text-slate-700 shadow-xs"
                    >
                      {lang === 'en' ? 'ગુજરાતી' : 'English'}
                    </button>
                  </div>

                  <div className="flex flex-col items-center text-center pt-2">
                    <div className="p-3 bg-white rounded-3xl border border-emerald-100 shadow-xs">
                      <Logo size="lg" />
                    </div>
                    <h1 className="text-2xl font-black text-slate-900 mt-2">{t.welcomeTitle}</h1>
                    <p className="text-xs font-bold text-[#15803D] mt-0.5">{t.welcomeSubtitle}</p>
                    <p className="text-xs text-slate-500 mt-1">{t.loginPrompt}</p>
                  </div>

                  <div className="bg-[#EAF7EE] border border-emerald-200 p-3 rounded-2xl text-xs">
                    <span className="font-extrabold text-slate-900 block">04 Vadtal (AWVAD04) • Taluka Anand</span>
                    <span className="text-slate-600 block text-[11px]">AWW: Shrimati Bhavnaben Patel • Sup: Shardaben Shah</span>
                  </div>

                  <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs space-y-3">
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">{t.userIdLabel}</label>
                      <input 
                        type="text" 
                        defaultValue="worker" 
                        id="loginUser" 
                        className="w-full bg-slate-50 border border-slate-200 text-sm font-semibold rounded-xl px-3 py-2.5" 
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">{t.passwordLabel}</label>
                      <input 
                        type="password" 
                        defaultValue="1234" 
                        id="loginPass" 
                        className="w-full bg-slate-50 border border-slate-200 text-sm font-semibold rounded-xl px-3 py-2.5" 
                      />
                    </div>
                    <button 
                      onClick={() => {
                        const u = document.getElementById('loginUser').value.trim();
                        const p = document.getElementById('loginPass').value.trim();
                        if (u === 'worker' && p === '1234') {
                          setIsAuthenticated(true);
                          setCurrentScreen('home');
                        } else {
                          alert("Invalid credentials! Enter 'worker' and '1234'.");
                        }
                      }}
                      className="w-full py-3 bg-[#15803D] hover:bg-[#166534] text-white font-bold text-sm rounded-xl transition-all shadow-sm"
                    >
                      {t.loginButton}
                    </button>
                  </div>
                </div>
              ) : currentScreen === 'home' ? (
                <!-- HOME SCREEN -->
                <div className="px-4 pt-1 pb-6 space-y-4">
                  <!-- Worker Profile Banner -->
                  <div className="bg-[#EAF7EE] border border-emerald-200 rounded-2xl p-3 flex items-center justify-between shadow-2xs">
                    <div className="flex items-center gap-3">
                      <div className="w-12 h-12 rounded-full bg-emerald-700 text-white flex items-center justify-center font-bold text-base shadow-xs shrink-0">
                        BP
                      </div>
                      <div>
                        <h2 className="font-bold text-slate-900 text-sm">{t.workerName}</h2>
                        <p className="text-[11px] text-slate-600 font-medium">{t.workerRole}</p>
                      </div>
                    </div>
                    <div className="text-right">
                      <span className="text-[11px] font-bold text-slate-800 block">04 Vadtal (Anand)</span>
                      <button 
                        onClick={() => setIsOnline(!isOnline)}
                        className={`px-2 py-0.5 rounded-full text-[10px] font-black border ${isOnline ? 'bg-emerald-100 text-emerald-900 border-emerald-300' : 'bg-amber-100 text-amber-900 border-amber-300'}`}
                      >
                        {isOnline ? t.online : t.offline}
                      </button>
                    </div>
                  </div>

                  <!-- Header Controls -->
                  <div className="flex items-center justify-between">
                    <Logo size="sm" />
                    <div className="flex items-center gap-2">
                      <button 
                        onClick={() => setLang(l => l === 'en' ? 'gu' : 'en')}
                        className="px-2.5 py-1 bg-white border border-slate-200 rounded-full text-xs font-bold shadow-2xs text-slate-700"
                      >
                        {lang === 'en' ? 'English' : 'ગુજરાતી'}
                      </button>
                      <button 
                        onClick={() => setIsNotifOpen(true)}
                        className="w-8 h-8 rounded-full bg-white border border-rose-200 text-rose-600 flex items-center justify-center shadow-2xs relative"
                      >
                        <span className="w-2 h-2 rounded-full bg-red-600 absolute top-1 right-1"></span>
                        🔔
                      </button>
                    </div>
                  </div>

                  <!-- 3x3 Illustrated Grid -->
                  <div className="grid grid-cols-3 gap-2.5">
                    {[
                      { id: 'stock-received', title: t.stockReceived, bg: 'bg-[#F0FDF4]', icon: '🚚' },
                      { id: 'stock-usage', title: t.stockUsage, bg: 'bg-[#FFF7ED]', icon: '🌾' },
                      { id: 'balance-remaining', title: t.balanceRemaining, bg: 'bg-[#F0FDF4]', icon: '📦' },
                      { id: 'setu-share', title: t.setuShareExchange, bg: 'bg-[#F0FDF4]', icon: '🤝' },
                      { id: 'food-menu', title: t.dailyFoodMenu, bg: 'bg-[#FFF7ED]', icon: '🍲' },
                      { id: 'student-attendance', title: t.studentAttendance, bg: 'bg-[#F0FDF4]', icon: '🧒' },
                      { id: 'meal-photo', title: t.mealPhotoUpload, bg: 'bg-[#FFF7ED]', icon: '📷' },
                      { id: 'smart-ration', title: t.smartRation, bg: 'bg-[#F0FDF4]', icon: '⚖️' },
                      { id: 'download-report', title: t.downloadReport, bg: 'bg-[#FFF7ED]', icon: '📄' }
                    ].map(card => (
                      <button
                        key={card.id}
                        onClick={() => setCurrentScreen(card.id)}
                        className={`${card.bg} border border-slate-200 rounded-2xl p-2.5 flex flex-col items-center justify-between text-center aspect-[4/4.8] shadow-xs active:scale-95 transition-all cursor-pointer`}
                      >
                        <div className="text-3xl my-auto">{card.icon}</div>
                        <span className="text-[11px] font-bold text-slate-900 leading-tight whitespace-pre-line">{card.title}</span>
                      </button>
                    ))}
                  </div>
                </div>
              ) : currentScreen === 'student-attendance' ? (
                <!-- ATTENDANCE SCREEN -->
                <div className="px-4 pt-2 pb-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <button onClick={() => setCurrentScreen('home')} className="w-9 h-9 rounded-full bg-[#EAF7EE] text-[#15803D] font-bold">←</button>
                    <Logo size="sm" />
                    <div className="w-9"></div>
                  </div>

                  <div className="text-center">
                    <h1 className="text-xl font-extrabold text-slate-900">{t.studentAttendance}</h1>
                    <p className="text-xs text-slate-500">10 Registered Model Roster (04 Vadtal)</p>
                  </div>

                  <div className="bg-[#EAF7EE] p-3 rounded-2xl border border-emerald-200 flex justify-between items-center">
                    <span className="text-xs font-bold text-emerald-950">
                      Attendance: {students.filter(s => s.present).length} / {students.length}
                    </span>
                    <div className="flex gap-1">
                      <button onClick={() => handleSetAllStudents(true)} className="px-2 py-1 bg-white text-emerald-800 text-[11px] font-bold rounded shadow-2xs">All Yes</button>
                      <button onClick={() => handleSetAllStudents(false)} className="px-2 py-1 bg-white text-slate-600 text-[11px] font-bold rounded shadow-2xs">All No</button>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-3 border border-slate-200 space-y-2">
                    {students.map(s => (
                      <div key={s.id} className="flex justify-between items-center py-1.5 border-b border-slate-100 last:border-none">
                        <div>
                          <span className="font-bold text-xs text-slate-900">{lang === 'gu' ? s.nameGu : s.name}</span>
                          <span className="text-[10px] text-slate-500 ml-2">({s.age})</span>
                        </div>
                        <button 
                          onClick={() => handleToggleStudent(s.id)}
                          className={`px-3 py-1 rounded-xl text-xs font-bold ${s.present ? 'bg-[#15803D] text-white' : 'bg-slate-100 text-slate-500'}`}
                        >
                          {s.present ? t.present : t.absent}
                        </button>
                      </div>
                    ))}
                  </div>

                  <button 
                    onClick={() => setCurrentScreen('food-menu')}
                    className="w-full py-3 bg-[#15803D] text-white font-bold text-xs rounded-xl shadow-sm"
                  >
                    Proceed to Daily Meal Entry →
                  </button>
                </div>
              ) : currentScreen === 'food-menu' ? (
                <!-- MEAL USAGE ENTRY -->
                <div className="px-4 pt-2 pb-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <button onClick={() => setCurrentScreen('home')} className="w-9 h-9 rounded-full bg-[#EAF7EE] text-[#15803D] font-bold">←</button>
                    <Logo size="sm" />
                    <div className="w-9"></div>
                  </div>

                  <div className="text-center">
                    <h1 className="text-xl font-extrabold text-slate-900">Meal Usage Entry</h1>
                    <p className="text-xs text-slate-500">04 Vadtal Centre • Daily Meal Register</p>
                  </div>

                  <div className="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
                    <div className="flex justify-between items-center bg-[#EAF7EE] p-2.5 rounded-xl">
                      <span className="font-bold text-slate-900 text-sm">Meal 1 – Breakfast (30g)</span>
                    </div>

                    <div className="flex justify-between items-center text-sm font-semibold">
                      <span>No. of Students Present:</span>
                      <span className="font-bold text-slate-900 text-base">{students.filter(s => s.present).length}</span>
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Menu – Select</label>
                      <select id="menuSelect" className="w-full bg-slate-50 border border-slate-200 text-xs font-semibold rounded-xl p-2.5">
                        <option>Sukdi (Atta)</option>
                        <option>Vegetable Khichdi (Rice + Dal)</option>
                        <option>Bal Shakti Sheera</option>
                      </select>
                    </div>

                    <div className="bg-[#EAF7EE] rounded-xl p-3 text-center border border-emerald-200">
                      <span className="text-lg font-black text-[#15803D]">
                        Total = {students.filter(s => s.present).length * 30} gm
                      </span>
                    </div>

                    <button 
                      onClick={() => {
                        const count = students.filter(s => s.present).length;
                        const menu = document.getElementById('menuSelect').value;
                        handleMealConfirm({
                          mealType: 'breakfast',
                          menuName: menu,
                          studentsCount: count,
                          totalGm: count * 30
                        });
                        alert("Meal deduction confirmed and updated to Firebase RTDB!");
                        setCurrentScreen('home');
                      }}
                      className="w-full py-3 bg-[#15803D] text-white font-bold text-xs rounded-xl shadow-sm"
                    >
                      ✓ Confirm Deduction
                    </button>
                  </div>
                </div>
              ) : currentScreen === 'stock-usage' ? (
                <!-- STOCK USAGE DISTRIBUTION -->
                <div className="px-4 pt-2 pb-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <button onClick={() => setCurrentScreen('home')} className="w-9 h-9 rounded-full bg-[#EAF7EE] text-[#15803D] font-bold">←</button>
                    <Logo size="sm" />
                    <div className="w-9"></div>
                  </div>

                  <div className="text-center">
                    <h1 className="text-xl font-extrabold text-slate-900">Stock Usage Entry</h1>
                    <p className="text-xs text-slate-500">Beneficiary Distribution Register</p>
                  </div>

                  <div className="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Beneficiary Name</label>
                      <select id="distBeneficiary" className="w-full bg-slate-50 border border-slate-200 text-xs font-semibold rounded-xl p-2.5">
                        <option>Surbhi Rawat (Lactating Mother)</option>
                        <option>Shreeya Dube (Pregnant Woman)</option>
                        <option>Aarav Patel (Child 6m-3y)</option>
                      </select>
                    </div>

                    <div className="space-y-2 pt-2">
                      <span className="text-xs font-bold text-slate-800 block">Items Distributed:</span>
                      {['Bal Shakti', 'Rice', 'Atta', 'Oil'].map(item => (
                        <div key={item} className="flex justify-between items-center text-xs">
                          <span className="font-semibold text-slate-700">{item}</span>
                          <span className="font-bold text-slate-900">1 Pack/Kg</span>
                        </div>
                      ))}
                    </div>

                    <button 
                      onClick={() => {
                        const b = document.getElementById('distBeneficiary').value;
                        handleDistributionConfirm({
                          beneficiaryName: b,
                          distributedItems: { 'Bal Shakti': 1, 'Rice': 1, 'Atta': 1, 'Oil': 1 }
                        });
                        alert("Distribution recorded and deducted from pantry!");
                        setCurrentScreen('home');
                      }}
                      className="w-full py-3 bg-[#15803D] text-white font-bold text-xs rounded-xl shadow-sm mt-3"
                    >
                      Confirm & Record Distribution
                    </button>
                  </div>
                </div>
              ) : currentScreen === 'balance-remaining' ? (
                <!-- BALANCE REMAINING SCREEN -->
                <div className="px-4 pt-2 pb-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <button onClick={() => setCurrentScreen('home')} className="w-9 h-9 rounded-full bg-[#EAF7EE] text-[#15803D] font-bold">←</button>
                    <Logo size="sm" />
                    <div className="w-9"></div>
                  </div>

                  <div className="text-center">
                    <h1 className="text-xl font-extrabold text-slate-900">Balance Remaining</h1>
                    <p className="text-xs text-slate-500">Live Pantry Register • 04 Vadtal</p>
                  </div>

                  <div className="space-y-2.5">
                    {inventory.map(item => (
                      <div key={item.id} className="bg-white rounded-2xl p-3 border border-slate-200 flex justify-between items-center shadow-xs">
                        <div>
                          <h4 className="font-bold text-xs text-slate-900">{lang === 'gu' ? item.nameGu : item.nameEn}</h4>
                          <span className="text-[10px] text-slate-500">Batch: {item.batchNo} • Exp: {item.expiryDate}</span>
                        </div>
                        <div className="text-right">
                          <span className="font-black text-sm text-[#15803D]">{item.currentStock} {item.unit}</span>
                          <span className="block text-[9px] text-slate-400">Cap: {item.initialStock}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : currentScreen === 'download-report' ? (
                <!-- DOWNLOAD REPORT SCREEN -->
                <div className="px-4 pt-2 pb-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <button onClick={() => setCurrentScreen('home')} className="w-9 h-9 rounded-full bg-[#EAF7EE] text-[#15803D] font-bold">←</button>
                    <Logo size="sm" />
                    <div className="w-9"></div>
                  </div>

                  <div className="text-center">
                    <h1 className="text-xl font-extrabold text-slate-900">Form MPR-6 Report</h1>
                    <p className="text-xs text-slate-500">Official Monthly Stock Ledger</p>
                  </div>

                  <div className="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
                    <button 
                      onClick={() => {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        doc.text("Government of Gujarat - Women & Child Development Department", 14, 15);
                        doc.text("PoshanSetu Form MPR-6 Monthly Stock Ledger - 04 Vadtal", 14, 22);
                        
                        const rows = inventory.map(i => [i.nameEn, `${i.currentStock} ${i.unit}`, i.batchNo, i.expiryDate]);
                        doc.autoTable({
                          startY: 30,
                          head: [['Item Name', 'Balance', 'Batch No', 'Expiry']],
                          body: rows
                        });
                        doc.save("PoshanSetu_Report_04_Vadtal.pdf");
                      }}
                      className="w-full py-3 bg-[#15803D] text-white font-bold text-xs rounded-xl shadow-sm"
                    >
                      Download Official A4 PDF
                    </button>

                    <button 
                      onClick={() => window.print()}
                      className="w-full py-3 bg-slate-900 text-white font-bold text-xs rounded-xl shadow-sm"
                    >
                      Print Form-6 (A4)
                    </button>
                  </div>
                </div>
              ) : (
                <!-- GENERAL FALLBACK FOR OTHER TILE SCREENS -->
                <div className="px-4 pt-2 pb-6 space-y-4 text-center">
                  <div className="flex items-center justify-between">
                    <button onClick={() => setCurrentScreen('home')} className="w-9 h-9 rounded-full bg-[#EAF7EE] text-[#15803D] font-bold">←</button>
                    <Logo size="sm" />
                    <div className="w-9"></div>
                  </div>
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 mt-6 space-y-3">
                    <h2 className="text-base font-bold text-slate-900 capitalize">{currentScreen.replace('-', ' ')}</h2>
                    <p className="text-xs text-slate-500">Feature enabled and synchronized with Firebase Realtime Database for AWC 04 Vadtal.</p>
                    <button onClick={() => setCurrentScreen('home')} className="px-4 py-2 bg-[#15803D] text-white font-bold text-xs rounded-xl">
                      Return to Home
                    </button>
                  </div>
                </div>
              )}
            </div>

            <!-- FLOATING BOTTOM DOCK -->
            {isAuthenticated && (
              <div className="fixed bottom-0 left-0 right-0 z-40 max-w-[420px] mx-auto bg-white/95 backdrop-blur-md border-t border-slate-200 px-3 py-2 shadow-lg">
                <div className="grid grid-cols-4 items-center text-center">
                  {[
                    { id: 'home', label: t.home, icon: '🏠', action: () => { setDockTab('home'); setCurrentScreen('home'); } },
                    { id: 'help', label: t.help, icon: '❓', action: () => setIsHelpOpen(true) },
                    { id: 'centre', label: t.centreDetails, icon: '🏫', action: () => setIsCentreOpen(true) },
                    { id: 'profile', label: t.profile, icon: '👤', action: () => setIsProfileOpen(true) }
                  ].map(item => (
                    <button key={item.id} onClick={item.action} className="flex flex-col items-center">
                      <span className="text-base">{item.icon}</span>
                      <span className={`text-[10px] mt-0.5 ${dockTab === item.id ? 'font-bold text-[#15803D]' : 'text-slate-500'}`}>
                        {item.label}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            <!-- MODAL: URGENT INSPECTION NOTIFICATION -->
            {isNotifOpen && (
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 p-0 sm:p-4">
                <div className="w-full max-w-[420px] bg-white rounded-t-3xl sm:rounded-3xl p-5 border-2 border-red-500 space-y-3">
                  <div className="flex justify-between items-center text-red-600 font-bold">
                    <span className="flex items-center gap-1.5 text-xs uppercase tracking-wider">⚠️ URGENT INSPECTION</span>
                    <button onClick={() => setIsNotifOpen(false)} className="text-slate-500 font-bold">✕</button>
                  </div>
                  <h3 className="font-extrabold text-base text-slate-900">Supervisor Shardaben Shah is Arriving!</h3>
                  <p className="text-xs text-slate-600">On-site physical inspection and register audit today at 04 Vadtal (AWVAD04), Taluka Anand.</p>
                  <div className="bg-red-50 p-2.5 rounded-xl border border-red-200 text-[11px] font-semibold text-red-950">
                    Required Ready: 30g Breakfast & 50g Lunch register, Stock Inward Batches, 10/10 student attendance.
                  </div>
                  <button onClick={() => setIsNotifOpen(false)} className="w-full py-2.5 bg-[#15803D] text-white font-bold text-xs rounded-xl">
                    ✓ Understood • Ready
                  </button>
                </div>
              </div>
            )}

            <!-- MODAL: CENTRE DETAILS -->
            {isCentreOpen && (
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 p-0 sm:p-4">
                <div className="w-full max-w-[420px] bg-white rounded-t-3xl sm:rounded-3xl p-5 space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-base text-slate-900">04 Vadtal Anganwadi Centre</h3>
                    <button onClick={() => setIsCentreOpen(false)} className="text-slate-500 font-bold">✕</button>
                  </div>
                  <div className="text-xs text-slate-600 space-y-1">
                    <p>Taluka: Anand • District: Anand • Code: AWVAD04</p>
                    <p>Worker: Shrimati Bhavnaben Patel • Supervisor: Shardaben Shah</p>
                    <div className="p-2 bg-emerald-50 text-emerald-800 rounded-lg font-semibold mt-2">
                      Model AWC Grade A+ • RO Water Functional • Gas Stove Available
                    </div>
                  </div>
                  <button onClick={() => setIsCentreOpen(false)} className="w-full py-2 bg-[#15803D] text-white font-bold text-xs rounded-xl">
                    Close
                  </button>
                </div>
              </div>
            )}

            <!-- MODAL: HELP -->
            {isHelpOpen && (
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 p-0 sm:p-4">
                <div className="w-full max-w-[420px] bg-white rounded-t-3xl sm:rounded-3xl p-5 space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-base text-slate-900">Helpdesk & Support</h3>
                    <button onClick={() => setIsHelpOpen(false)} className="text-slate-500 font-bold">✕</button>
                  </div>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div className="p-2 bg-emerald-50 rounded-xl">
                      <span className="text-[10px] text-emerald-800 font-bold block">Poshan Helpline</span>
                      <span className="font-extrabold text-sm text-emerald-950">14408</span>
                    </div>
                    <div className="p-2 bg-orange-50 rounded-xl">
                      <span className="text-[10px] text-orange-800 font-bold block">Childline</span>
                      <span className="font-extrabold text-sm text-orange-950">1098</span>
                    </div>
                  </div>
                  <button onClick={() => setIsHelpOpen(false)} className="w-full py-2 bg-[#15803D] text-white font-bold text-xs rounded-xl">
                    Close
                  </button>
                </div>
              </div>
            )}

            <!-- MODAL: PROFILE -->
            {isProfileOpen && (
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 p-0 sm:p-4">
                <div className="w-full max-w-[420px] bg-white rounded-t-3xl sm:rounded-3xl p-5 space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-base text-slate-900">Worker Profile</h3>
                    <button onClick={() => setIsProfileOpen(false)} className="text-slate-500 font-bold">✕</button>
                  </div>
                  <div className="text-xs space-y-2">
                    <div className="p-2.5 bg-slate-50 rounded-xl">
                      <span className="font-bold text-slate-800 block text-sm">Shrimati Bhavnaben Patel</span>
                      <span className="text-slate-500">Anganwadi Worker • WCD ID: AWVAD04-GUJ</span>
                    </div>
                    <div className="p-2.5 bg-emerald-50 text-emerald-900 rounded-xl font-mono text-[11px] break-all">
                      https://poshan-setu-default-rtdb.firebaseio.com/awc_awvad04
                    </div>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button 
                      onClick={() => { setIsAuthenticated(false); setIsProfileOpen(false); }} 
                      className="flex-1 py-2 border border-rose-200 text-rose-700 font-bold text-xs rounded-xl"
                    >
                      Log Out
                    </button>
                    <button onClick={() => setIsProfileOpen(false)} className="flex-1 py-2 bg-[#15803D] text-white font-bold text-xs rounded-xl">
                      Done
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
