<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PoshanSetu Worker App</title>
  <meta name="theme-color" content="#163a70">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PieSocket Free Real-Time Sync CDN -->
  <script src="https://unpkg.com/piesocket-js@5"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-[#f0f4f9] flex justify-center min-h-screen text-slate-800 antialiased">
  <div class="w-full max-w-[420px] bg-[#f8fafc] min-h-screen flex flex-col shadow-2xl relative pb-28 border-x border-slate-200">
    
    <!-- Top Header -->
    <header class="bg-gradient-to-b from-[#163a70] to-[#2563eb] text-white pt-6 pb-16 px-5 rounded-b-[32px] shadow-lg">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full border-2 border-emerald-400 bg-slate-900 flex items-center justify-center font-bold text-emerald-400">ગી</div>
          <div>
            <h1 class="text-sm font-bold">ગીતાબેન (કાર્યકર)</h1>
            <p class="text-[11px] text-blue-200">કેન્દ્ર: ૦૪ - વડતાલ (આણંદ)</p>
          </div>
        </div>
        <div id="sync-badge" class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>લાઈવ કનેક્ટેડ</span>
        </div>
      </div>
    </header>

    <!-- Main Stock Card -->
    <div class="px-5 -mt-10 z-10">
      <div class="bg-[#0f172a] text-white rounded-2xl p-5 shadow-xl border border-slate-800">
        <p class="text-xs text-slate-400 font-medium">કુલ ઉપલબ્ધ બાલભોગ જથ્થો</p>
        <div class="flex justify-between items-end mt-1">
          <div>
            <span id="balbhog-display" class="text-3xl font-black text-emerald-400">92</span>
            <span class="text-xs text-slate-400 ml-1">પેકેટ સિલક</span>
          </div>
          <span class="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded font-bold">ઓટો-સિંક</span>
        </div>
      </div>
    </div>

    <!-- Quick Action Steppers -->
    <main class="p-5 space-y-4 flex-1">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">દૈનિક કામગીરી (Daily Action)</h2>
      
      <!-- Action 1: Add Inward -->
      <div class="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm space-y-3">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm font-bold text-slate-800">નવો જથ્થો જમા કરો</p>
            <p class="text-[11px] text-slate-400">બાલભોગ સ્ટોક આવક</p>
          </div>
          <span class="text-xs font-extrabold text-blue-600 bg-blue-50 px-2 py-1 rounded-lg">+ આવક</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="adjustTemp('inward-val', -10)" class="w-10 h-10 bg-slate-100 rounded-xl font-black text-slate-700 active:bg-slate-200">-</button>
          <input type="number" id="inward-val" value="20" class="w-full text-center text-lg font-bold bg-slate-50 py-1.5 rounded-xl border border-slate-200" readonly>
          <button onclick="adjustTemp('inward-val', 10)" class="w-10 h-10 bg-slate-100 rounded-xl font-black text-slate-700 active:bg-slate-200">+</button>
        </div>
        <button onclick="submitStockChange('INWARD')" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow-md text-xs flex items-center justify-center gap-1.5">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> સ્ટોકમાં જમા કરો (Send Inward)
        </button>
      </div>

      <!-- Action 2: Daily Consumption -->
      <div class="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm space-y-3">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm font-bold text-slate-800">આજનું દૈનિક વિતરણ</p>
            <p class="text-[11px] text-slate-400">બાળકોમાં વિતરણ નોંધણી</p>
          </div>
          <span class="text-xs font-extrabold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg">- વિતરણ</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="adjustTemp('consume-val', -1)" class="w-10 h-10 bg-slate-100 rounded-xl font-black text-slate-700 active:bg-slate-200">-</button>
          <input type="number" id="consume-val" value="5" class="w-full text-center text-lg font-bold bg-slate-50 py-1.5 rounded-xl border border-slate-200" readonly>
          <button onclick="adjustTemp('consume-val', 1)" class="w-10 h-10 bg-slate-100 rounded-xl font-black text-slate-700 active:bg-slate-200">+</button>
        </div>
        <button onclick="submitStockChange('CONSUMPTION')" class="w-full bg-emerald-600 active:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-md text-xs flex items-center justify-center gap-1.5">
          <i data-lucide="check" class="w-4 h-4"></i> વિતરણ સાચવો (Deduct Balance)
        </button>
      </div>
    </main>

    <!-- Bottom Toast -->
    <div id="worker-toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 z-50">
      <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
      <span id="worker-toast-text">અપડેટ મોકલી દેવાયું!</span>
    </div>
  </div>

  <script>
    let balbhogStock = 92;
    // Shared public WebSocket channel for live communication
    const pieSocket = new PieSocket.default({
      apiKey: '0p7eFjY0U0H7X2k1FmB4vN9aL3sQ6wE8rT1yU4iO', // Public demo key
      clusterId: 'demo'
    });

    let liveChannel;
    pieSocket.subscribe('poshansetu-live-demo').then(ch => {
      liveChannel = ch;
      liveChannel.listen('stock-update', (data) => {
        balbhogStock = data.newBalance;
        document.getElementById('balbhog-display').innerText = balbhogStock;
      });
    });

    function adjustTemp(id, delta) {
      const el = document.getElementById(id);
      let v = Math.max(1, (parseInt(el.value) || 0) + delta);
      el.value = v;
    }

    function submitStockChange(type) {
      let change = 0;
      let label = "";
      if (type === 'INWARD') {
        change = parseInt(document.getElementById('inward-val').value) || 0;
        balbhogStock += change;
        label = "નવો સ્ટોક મળ્યો";
      } else {
        change = parseInt(document.getElementById('consume-val').value) || 0;
        if (change > balbhogStock) { alert('ભૂલ: પૂરતો સ્ટોક નથી!'); return; }
        balbhogStock -= change;
        change = -change;
        label = "બાળકોમાં વિતરણ";
      }

      document.getElementById('balbhog-display').innerText = balbhogStock;

      const payload = {
        center: "૦૪ - વડતાલ (આણંદ)",
        worker: "ગીતાબેન",
        item: "બાલભોગ",
        change: change,
        newBalance: balbhogStock,
        label: label,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      };

      if (liveChannel) {
        liveChannel.publish('stock-update', payload);
      }

      const t = document.getElementById('worker-toast');
      document.getElementById('worker-toast-text').innerText = `${label}: ડેટા ઓફિસર સ્ક્રીન પર મોકલાયો!`;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2500);
    }

    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  </script>
</body>
</html>
